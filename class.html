<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Class</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/class.css"
    >

</head>

<body>

    <div id="navbar"></div>

    <div id="main">

        <div id="classHeader">

            <div>

                <h1 id="className">

                    Loading...

                </h1>

                <p id="teacherName">

                    Loading...

                </p>

            </div>

            <button
                id="manageStudentsButton"
            >

                Manage Students

            </button>

        </div>

        <div id="createPost">

            <textarea
                id="postInput"
                placeholder="Share something with your class..."
            ></textarea>

            <div id="createButtons">

                <button
                    id="postButton"
                >

                    Post

                </button>

            </div>

        </div>

        <div id="posts">

            Loading...

        </div>

    </div>

    <div
        id="studentManager"
        style="display:none;"
    >

        <div id="studentManagerCard">

            <h2>

                Manage Students

            </h2>

            <div id="studentControls">

                <input
                    id="studentSearch"
                    type="text"
                    placeholder="Search username..."
                >

                <button
                    id="addStudentButton"
                >

                    Add Student

                </button>

            </div>

            <div id="studentList">

                Loading...

            </div>

            <button
                id="closeStudentManager"
            >

                Close

            </button>

        </div>

    </div>

    <script src="js/supabase.js"></script>

    <script src="js/navbar.js"></script>

    <script src="js/class.js"></script>

</body>

</html>
