<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HBN Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

    <div id="adminPanel">

        <h1>HBN Admin Panel</h1>

        <p>Create invitation codes for students.</p>

        <div id="controls">

            <input
                id="amountInput"
                type="number"
                min="1"
                value="10"
                placeholder="Amount"
            >

            <button id="generateButton">
                Generate
            </button>

            <button id="copyAllButton">
                Copy All
            </button>

            <button id="clearButton">
                Clear
            </button>

        </div>

        <input
            id="searchInput"
            type="text"
            placeholder="Search codes..."
        >

        <h2>Unused Codes</h2>

        <div id="unusedList"></div>

        <h2>Used Codes</h2>

        <div id="usedList"></div>

    </div>

    <script src="js/supabase.js"></script>
    <script src="js/admin.js"></script>

</body>

</html>
